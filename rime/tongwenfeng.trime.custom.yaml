patch:
  # === 中/英 切换 ===
  # 常驻栏的 中/En 按钮翻 rime 的 ascii_mode；App 会按键盘声明的 ascii_keyboard
  # 自动切到西文全键盘 t9_en（见 preset_keyboards/t9 的 ascii_keyboard）。
  # Keyboard_t9_cn 留给 t9_en 自带的「中/英」键。
  preset_keys/Keyboard_t9_cn: {label: 中/英, send: Eisu_toggle, select: t9}

  # === 九宫格（中文）===
  # id 必须与方案 id 相同（t9），Trime 才会按方案自动选中：
  # KeyboardWindow.smartMatchKeyboard() -> if (presetKeyboardIds.contains(schemaId)) return schemaId
  preset_keyboards/t9:
    name: 九宫格
    ascii_mode: 0
    reset_ascii_mode: true     # 切到本键盘时强制回中文
    ascii_keyboard: t9_en      # 常驻栏切 ascii 时自动换到西文全键盘
    width: 25          # 每键重量；100/25 = 4 列
    columns: 4
    height: 55
    keyboard_height: 280
    lock: true
    key_hint_offset_x: 38      # 把 hint（数字提示）推到键的右下角；空格键更宽，单独覆盖
    keys:
      - {click: ',', long_click: '.', swipe_down: {commit: '1', label: '1'}, hint: '1', label: '，', label_symbol: '。'}
      - {click: '2', label: ABC, swipe_down: {commit: '2', label: '2'}, hint: '2'}
      - {click: '3', label: DEF, swipe_down: {commit: '3', label: '3'}, hint: '3'}
      - {click: Keyboard_symbols, long_click: Keyboard_number, label: 符号}   # 长按直达「数字+」键盘
      - {click: '4', label: GHI, swipe_down: {commit: '4', label: '4'}, hint: '4'}
      - {click: '5', label: JKL, swipe_down: {commit: '5', label: '5'}, hint: '5'}
      - {click: '6', label: MNO, swipe_down: {commit: '6', label: '6'}, hint: '6'}
      - {click: "'", label: 分词}
      - {click: '7', label: PQRS, swipe_down: {commit: '7', label: '7'}, hint: '7'}
      - {click: '8', label: TUV, swipe_down: {commit: '8', label: '8'}, hint: '8'}
      - {click: '9', label: WXYZ, swipe_down: {commit: '9', label: '9'}, hint: '9'}
      - {click: BackSpace, label: ⌫}
      - {click: Return, composing: Return1, long_click: CommitComment, label: ↵}   # 回车放到左下角
      - {click: space, width: 50, swipe_down: {commit: '0', label: '0'}, hint: '0', key_hint_offset_x: 88, label: 空格}
      - {click: Menu, swipe_up: '?', swipe_down: '!', label_symbol: '？！'}   # 方案菜单；上滑 ？　下滑 ！

  # === 西文全键盘（常驻栏 中/En 或 t9_en 自带的键进入）===
  preset_keyboards/t9_en:
    name: 全键盘（西文）
    ascii_mode: 1
    reset_ascii_mode: true     # 切到本键盘时强制西文
    ascii_keyboard: t9         # 切回中文时回到九宫格
    width: 10
    height: 44
    lock: true
    keys:
      - {click: q, long_click: '1'}
      - {click: w, long_click: '2'}
      - {click: e, long_click: '3'}
      - {click: r, long_click: '4'}
      - {click: t, long_click: '5'}
      - {click: y, long_click: '6'}
      - {click: u, long_click: '7'}
      - {click: i, long_click: '8'}
      - {click: o, long_click: '9'}
      - {click: p, long_click: '0'}
      - {width: 5}
      - {click: a, long_click: select_all}
      - {click: s, long_click: '@'}
      - {click: d, long_click: '#'}
      - {click: f, long_click: '$'}
      - {click: g, long_click: '%'}
      - {click: h, long_click: '!'}
      - {click: j, long_click: '&'}
      - {click: k, long_click: '*'}
      - {click: l, long_click: '(){Left}'}
      - {width: 5}
      - {click: Shift_L, width: 15}
      - {click: z, long_click: '`'}
      - {click: x, long_click: cut}
      - {click: c, long_click: copy}
      - {click: v, long_click: paste}
      - {click: b, long_click: '~'}
      - {click: n, long_click: ';'}
      - {click: m, long_click: '?'}
      - {click: BackSpace, width: 15}
      - {click: Return, width: 15}                                        # 回车放左下角
      - {click: ',', width: 15, label: ','}                               # 空格左边：逗号
      - {click: space, width: 40}
      - {click: '.', width: 15, label: '.'}                               # 空格右边：句号
      - {click: Keyboard_t9_cn, long_click: Menu, width: 15, label: 中/英}   # 回九宫格，长按出菜单
